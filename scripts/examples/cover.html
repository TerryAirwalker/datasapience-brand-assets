<!doctype html><html><head><meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
body{position:relative;background:#004158;font-family:'Ping LCG'}
.blob{position:absolute;border-radius:50%;filter:blur(8px)}
</style></head>
<body>
  <!-- декор: мягкие блобы mid-тил + зелёный акцент -->
  <div class="blob" style="left:-260px;top:-220px;width:760px;height:760px;
    background:radial-gradient(circle,#4F9AAB 0%,rgba(79,154,171,.15) 55%,transparent 72%)"></div>
  <div class="blob" style="right:-300px;bottom:-320px;width:900px;height:900px;
    background:radial-gradient(circle,#4F9AAB 0%,rgba(79,154,171,.12) 52%,transparent 70%)"></div>
  <div class="blob" style="right:120px;top:120px;width:240px;height:240px;
    background:radial-gradient(circle,rgba(141,233,105,.35),transparent 68%)"></div>

  <!-- текстовые блоки .t -->
  <div class="t" data-nowrap style="position:absolute;left:150px;top:150px;
    font-family:'Ping LCG';font-weight:500;font-size:30px;letter-spacing:.22em;
    color:#8DE969;text-transform:uppercase">Отчёт · II квартал 2026</div>

  <div class="t" style="position:absolute;left:148px;top:360px;width:1500px;
    font-family:'Unbounded';font-weight:800;font-size:92px;line-height:1.06;
    color:#FFFFFF">Аналитика данных <span style="color:#8DE969">под управлением</span></div>

  <div class="t" style="position:absolute;left:152px;top:660px;width:1180px;
    font-family:'Ping LCG';font-weight:500;font-size:38px;line-height:1.4;
    color:#CAE7EF">Платформа Data Sapience: единый контур для хранения,
    обработки и продуктивизации данных</div>

  <div class="t" data-nowrap style="position:absolute;left:152px;top:980px;
    font-family:'Ping LCG';font-weight:400;font-size:24px;color:#4F9AAB">datasapience.ru</div>
</body></html>
